name: Supabase keep-alive
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase (public anon key, read-only)
        run: |
          URL=$(jq -r .supabaseUrl data/site.json)
          KEY=$(jq -r .supabaseAnonKey data/site.json)
          curl -fsS -X POST "$URL/rest/v1/rpc/keepalive" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
          curl -fsS "$URL/rest/v1/reviews?select=rating&status=eq.approved&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /dev/null
